<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D56CB"/>
      <stop offset="0.55" stop-color="#766FE4"/>
      <stop offset="1" stop-color="#9893F5"/>
    </linearGradient>
    <linearGradient id="titleStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5D56CB" stop-opacity=".9"/>
      <stop offset="1" stop-color="#BAACF9" stop-opacity=".85"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="450" y="178" text-anchor="middle"
        font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"
        font-size="154" font-weight="800" letter-spacing="16"
        fill="url(#titleFill)" stroke="url(#titleStroke)" stroke-width="2"
        paint-order="stroke" filter="url(#glow)">破茧</text>
</svg>
